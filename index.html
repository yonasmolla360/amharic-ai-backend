<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amharic AI</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        #chat-container { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .message { margin: 8px 0; padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background-color: var(--tg-theme-button-color, #2481cc); color: white; align-self: flex-end; margin-left: auto; }
        .ai { background-color: var(--tg-theme-secondary-bg-color, #f0f0f0); }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 20px; background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); cursor: pointer; }
    </style>
</head>
<body>
    <h3 style="text-align: center;">አማርኛ AI (Amharic AI)</h3>
    <div id="chat-container"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="እዚህ ይጻፉ...">
        <button onclick="sendMessage()">ላክ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function sendMessage() {
            const inputElement = document.getElementById('user-input');
            const text = inputElement.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputElement.value = '';

            try {
                const response = await fetch('https://pythonanywhere.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage(data.reply, 'ai');
            } catch (error) {
                appendMessage("ይቅርታ፣ ስህተት አጋጥሟል።", 'ai');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
